<style>
  :root { color-scheme: dark; --bg: #0c0c10; --text: rgba(255,255,255,.94); --text2: rgba(235,235,245,.62); --line: rgba(255,255,255,.12); --accent: #7f7fff; --card: rgba(255,255,255,.05); --inv: #f5f5f7; --invt: #0c0c10; --bad: #ff8a8a; }
  @media (prefers-color-scheme: light) { :root { color-scheme: light; --bg: #f5f5f7; --text: rgba(20,20,25,.94); --text2: rgba(60,60,67,.7); --line: rgba(0,0,0,.12); --accent: #5f5fff; --card: #fff; --inv: #141419; --invt: #fff; --bad: #b42323; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: radial-gradient(at top center, rgba(127,127,255,.12), transparent 60%), var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; }
  form { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 14px; }
  .mark { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, var(--accent), #47a3ff); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 19px; }
  h1 { font-size: 20px; margin: 4px 0 0; }
  p { margin: 0; color: var(--text2); font-size: 14px; }
  .pw { font: inherit; font-size: 15px; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--text); }
  .pw:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(127,127,255,.2); }
  button { font: inherit; font-weight: 600; padding: 11px; border-radius: 999px; border: 0; background: var(--inv); color: var(--invt); cursor: pointer; }
  button:disabled { opacity: .5; }
  label.k { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--text2); cursor: pointer; }
  label.k input { width: 16px; height: 16px; accent-color: var(--accent); }
  .err { color: var(--bad); font-size: 13px; min-height: 18px; }
</style>
